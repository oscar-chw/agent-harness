<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">Agent Harness 3.0.0rc2 architecture</title>
<desc id="desc">Native clients use separate MCP processes. Project-scoped task coordination and source-backed memory are shared locally. The work graph runs guarded gates. Evaluation controls candidate adoption. Model behavior and cross-device synchronization require separate verification.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto-start-reverse"><path d="M0,0 L0,6 L7,3 z" fill="#38615c"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193b36}.boxTitle{font-size:22px;font-weight:700}.boxBody{font-size:18px;fill:#3e5b55}.edgeLabel{font-size:16px;fill:#315a53;paint-order:stroke;stroke:#f4f7f3;stroke-width:5px;stroke-linejoin:round}.section{font-size:18px;font-weight:700;letter-spacing:1px}.small{font-size:17px;fill:#52665f}</style>
<rect width="1440" height="1040" fill="#f4f7f3"/>
<text x="50" y="48" font-size="31" font-weight="700">Work survives the conversation</text>
<text x="50" y="79" class="small">As-built mechanisms / 3.0.0rc2 / 13 November 2026 / local request-driven processes</text>
<rect x="60" y="112" width="405" height="105" rx="12" fill="#ffffff" stroke="#c9d3cf"/><text x="82" y="146" class="boxTitle">Client A</text><text x="82" y="175" class="boxBody">Native app + selected model</text><text x="82" y="199" class="boxBody">Own login, tools and approvals</text><rect x="505" y="112" width="405" height="105" rx="12" fill="#ffffff" stroke="#c9d3cf"/><text x="527" y="146" class="boxTitle">Client B</text><text x="527" y="175" class="boxBody">Independent session or model</text><text x="527" y="199" class="boxBody">Own login, tools and approvals</text><rect x="970" y="112" width="410" height="105" rx="12" fill="#ffffff" stroke="#c9d3cf"/><text x="992" y="146" class="boxTitle">CLI entrypoints</text><text x="992" y="175" class="boxBody">harness task publishes board checkpoints</text><text x="992" y="199" class="boxBody">plan operates the work graph</text><rect x="35" y="254" width="1370" height="606" rx="18" fill="#eaf0e9" stroke="#b7c9bd"/><text x="60" y="284" class="section">LOCAL HARNESS / SAME HOME + CANONICAL PROJECT</text><rect x="60" y="310" width="850" height="112" rx="12" fill="#ffffff" stroke="#c9d3cf"/><text x="82" y="344" class="boxTitle">Per-client MCP server</text><text x="82" y="373" class="boxBody">One process per connection; initialization and tool-response context</text><text x="82" y="397" class="boxBody">Supported lifecycle hooks provide another client-specific entrypoint</text><rect x="970" y="310" width="410" height="112" rx="12" fill="#ffffff" stroke="#c9d3cf"/><text x="992" y="344" class="boxTitle">Work graph</text><text x="992" y="373" class="boxBody">Dependencies, claims and gate evidence</text><text x="992" y="397" class="boxBody">Exit 0 settles; failure returns pending</text><rect x="60" y="496" width="405" height="145" rx="12" fill="#ffffff" stroke="#c9d3cf"/><text x="82" y="530" class="boxTitle">Shared task board</text><text x="82" y="559" class="boxBody">SQLite tasks, versions and event cursors</text><text x="82" y="583" class="boxBody">CAS rejects stale writes; retries use IDs</text><text x="82" y="607" class="boxBody">Advisory summaries point to checkpoints</text><rect x="505" y="496" width="405" height="145" rx="12" fill="#ffffff" stroke="#c9d3cf"/><text x="527" y="530" class="boxTitle">Source-backed memory</text><text x="527" y="559" class="boxBody">Retained revisions and scoped claims</text><text x="527" y="583" class="boxBody">Lexical / FTS retrieval and source checks</text><text x="527" y="607" class="boxBody">Corrections invalidate derived evidence</text><rect x="970" y="496" width="410" height="145" rx="12" fill="#ffffff" stroke="#c9d3cf"/><text x="992" y="530" class="boxTitle">Execution controls</text><text x="992" y="559" class="boxBody">Command guard screens gate commands</text><text x="992" y="583" class="boxBody">Native approvals and OS rights still apply</text><text x="992" y="607" class="boxBody">Sandbox protection depends on setup</text><rect x="60" y="713" width="850" height="108" rx="12" fill="#fff4df" stroke="#d4b478"/><text x="82" y="747" class="boxTitle">Evaluation and scoped adoption</text><text x="82" y="776" class="boxBody">Frozen cases + independent outcomes + measured preparation/trial cost</text><text x="82" y="800" class="boxBody">Generated procedures remain held after token regression</text><rect x="970" y="713" width="410" height="108" rx="12" fill="#ffffff" stroke="#c9d3cf"/><text x="992" y="747" class="boxTitle">Tools, tests and artifacts</text><text x="992" y="776" class="boxBody">Real subprocess results become evidence</text><text x="992" y="800" class="boxBody">A passing gate has its declared scope</text><path d="M262 217 V310" fill="none" stroke="#38615c" stroke-width="2"   marker-end="url(#arrow)"/><path d="M707 217 V310" fill="none" stroke="#38615c" stroke-width="2"   marker-end="url(#arrow)"/><path d="M1175 217 V310" fill="none" stroke="#38615c" stroke-width="2"   marker-end="url(#arrow)"/><path d="M910 364 H970" fill="none" stroke="#38615c" stroke-width="2"   marker-end="url(#arrow)"/><text x="920" y="347" class="edgeLabel">plan tool</text><path d="M262 422 V496" fill="none" stroke="#38615c" stroke-width="2"  marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="275" y="465" class="edgeLabel">read / checkpoint</text><path d="M707 422 V496" fill="none" stroke="#38615c" stroke-width="2"  marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="720" y="465" class="edgeLabel">retrieve / record</text><path d="M1175 422 V496" fill="none" stroke="#38615c" stroke-width="2"   marker-end="url(#arrow)"/><text x="1188" y="465" class="edgeLabel">screen command</text><path d="M1175 641 V713" fill="none" stroke="#38615c" stroke-width="2"   marker-end="url(#arrow)"/><text x="1190" y="681" class="edgeLabel">allowed execution</text><path d="M970 766 H910" fill="none" stroke="#38615c" stroke-width="2"   marker-end="url(#arrow)"/><text x="915" y="748" class="edgeLabel">outcomes</text><path d="M707 713 V641" fill="none" stroke="#38615c" stroke-width="2" stroke-dasharray="7 6"  marker-end="url(#arrow)"/><text x="720" y="685" class="edgeLabel">admitted scope only</text><path d="M1380 765 H1393 V364 H1380" fill="none" stroke="#38615c" stroke-width="2" stroke-dasharray="7 6"  marker-end="url(#arrow)"/><text x="60" y="896" class="section">FOUR DESIGN DIRECTIONS</text><text x="1418" y="690" transform="rotate(-90 1418 690)" font-size="14" fill="#52665f">failed gate returns pending</text><text x="60" y="929" font-size="21" font-weight="700">Framework</text><text x="60" y="957" font-size="17" fill="#52665f">Coordination and recovery</text><text x="405" y="929" font-size="21" font-weight="700">Methodology</text><text x="405" y="957" font-size="17" fill="#52665f">Gates, review and evaluation</text><text x="750" y="929" font-size="21" font-weight="700">Philosophy</text><text x="750" y="957" font-size="17" fill="#52665f">Assumptions and counterexamples</text><text x="1095" y="929" font-size="21" font-weight="700">Knowledge</text><text x="1095" y="957" font-size="17" fill="#52665f">Sources and corrections</text><text x="60" y="1007" class="small">Solid arrows show request/data paths. Dashed arrows show conditional feedback. Cross-device synchronization remains unqualified.</text></svg>