# Root pytest configuration — applies the repo's own tier marker scheme (plan
# v3-eval-pipeline node 13). The template lives at
# src/agent_harness/workgraph/tiers/pytest.ini for downstream projects; this
# file self-applies it. --strict-markers makes an unregistered mark an error,
# so a typo'd tier marker fails collection instead of silently deselecting.
# testpaths keeps a bare `pytest` on tests eval (never .harness-work copies);
# explicit paths on the command line still win. No verbosity here: addopts -q
# would double with callers' own -q into -qq, which changes --collect-only
# output to per-file counts and breaks the inventory's collected-count parse.
[pytest]
addopts = --strict-markers
testpaths = tests eval
markers =
    case: a single worked case — one input, one asserted output
    integration: crosses a real component boundary (server, store, subprocess)
    property: a property or invariant sweep over generated inputs
    eval: model-in-the-loop evaluation instrument cases
    perf: performance probes and threshold gates
    e2e: end-to-end journeys over sandboxed stores
